<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Mini Dashboard (No-Build)</title>

    <!-- Стили -->
    <link rel="stylesheet" href="/styles.css" />

    <!-- Preact + HTM (нативные ES-модули из CDN) -->
    <script type="module">
        import { h, render } from "https://esm.sh/preact@10.19.3";
        import htm from "https://esm.sh/htm@3.1.1";

        // Делаем htm-синтаксис аналогом JSX
        window.html = htm.bind(h);
        window.preactRender = render;
        window.preact = { h };
    </script>

    <!-- Наш основной клиентский модуль -->
    <script type="module" src="/app.js"></script>
</head>

<body>
    <div id="app"></div>
</body>

</html>
